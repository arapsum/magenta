<svg
  width="300"
  height="300"
  viewBox="0 0 300 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="rim" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#b9f6ff" stop-opacity="0.95" />
      <stop offset="18%" stop-color="#5fe0ff" stop-opacity="0.55" />
      <stop offset="42%" stop-color="#2da6c9" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#1b8dad" stop-opacity="0.18" />
      <stop offset="88%" stop-color="#35d6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a3f0ff" stop-opacity="0.65" />
    </linearGradient>

    <filter id="rimGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <!-- Crisp illuminated rim. -->
  <circle cx="150" cy="150" r="119" stroke="url(#rim)" stroke-width="2.2" />

  <!-- Lower rim accent. -->
  <path
    d="M 62 231 C 103 275, 191 287, 247 225"
    stroke="#25c8ef"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.6"
    filter="url(#rimGlow)"
  />
</svg>
