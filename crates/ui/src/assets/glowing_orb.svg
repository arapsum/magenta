<svg
  width="300"
  height="300"
  viewBox="0 0 300 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="sphere" cx="38%" cy="32%" r="74%" fx="35%" fy="28%">
      <stop offset="0%" stop-color="#172226" />
      <stop offset="28%" stop-color="#0b1215" />
      <stop offset="62%" stop-color="#070c0e" />
      <stop offset="82%" stop-color="#08141a" />
      <stop offset="100%" stop-color="#063747" />
    </radialGradient>

    <radialGradient id="topReflection" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#d9f9ff" stop-opacity="0.18" />
      <stop offset="30%" stop-color="#79cfe8" stop-opacity="0.07" />
      <stop offset="68%" stop-color="#79cfe8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#16b8e4" stop-opacity="0.34" />
      <stop offset="35%" stop-color="#1387a8" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#0a566d" stop-opacity="0" />
    </radialGradient>

    <clipPath id="orbClip">
      <circle cx="150" cy="150" r="120" />
    </clipPath>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" />
    </filter>
  </defs>

  <!-- Faint exterior bloom. -->
  <circle
    cx="150"
    cy="150"
    r="120"
    stroke="#22c9f2"
    stroke-width="5"
    opacity="0.13"
    filter="url(#rimGlow)"
  />

  <!-- Main dark glass volume. -->
  <circle cx="150" cy="150" r="120" fill="url(#sphere)" />

  <g clip-path="url(#orbClip)">
    <!-- Broad upper reflection. -->
    <ellipse
      cx="127"
      cy="62"
      rx="105"
      ry="76"
      fill="url(#topReflection)"
      transform="rotate(-8 127 62)"
    />

    <!-- Lower blue glass coloration. -->
    <ellipse
      cx="142"
      cy="254"
      rx="122"
      ry="83"
      fill="url(#bottomGlow)"
      filter="url(#softBlur)"
    />

    <!-- Smoky diagonal interior reflection. -->
    <ellipse
      cx="194"
      cy="120"
      rx="112"
      ry="39"
      transform="rotate(-22 194 120)"
      fill="#9ae9ff"
      opacity="0.035"
    />

    <!-- Darker glass refraction beneath the ribbon. -->
    <path
      d="M 20 154 C 42 111, 71 116, 106 132 C 142 148, 174 177, 207 183 C 236 188, 259 175, 280 143"
      stroke="#000000"
      stroke-width="18"
      opacity="0.28"
      filter="url(#softBlur)"
    />

  </g>

</svg>
