[workspace]
resolver = "2"
members = [
    "crates/application",
    "crates/core",
    "crates/desktop",
    "crates/providers",
    "crates/storage",
    "crates/ui",
]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-lock = "3"
async-net = "2"
async-stream = "0.3"
base64 = "0.22"
dirs = "6"
futures-core = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["io"] }
http_client = { git = "https://github.com/zed-industries/zed" }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
magenta-application = { path = "crates/application" }
magenta-core = { path = "crates/core" }
magenta-providers = { path = "crates/providers" }
magenta-storage = { path = "crates/storage" }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
tempfile = "3"
magenta-ui = { path = "crates/ui" }
parking_lot = "0.12"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "49229371e095bfd2ca77d336b5972b16956f0a87" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "49229371e095bfd2ca77d336b5972b16956f0a87" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
rand = "0.9"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", default-features = false, features = ["embed-fonts", "standalone"] }
ratex-types = "0.1.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
